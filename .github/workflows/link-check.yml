name: Citation link check

# C7-006: cited sources rot over time. Once a week, check every citation link
# (browser User-Agent, 3 workers, HEAD then GET). Only links that return 404/410
# are changed: they point to the Internet Archive snapshot when one exists,
# otherwise the link is removed and marked "(source no longer available)".
# Bot-blocked (401/403/429/202) and erroring links are never changed.
# No replacement source is ever invented.

on:
  schedule:
    - cron: '30 9 * * 1'  # Mondays 09:30 UTC, away from the daily 03:55 collection
  workflow_dispatch:

concurrency:
  group: dailyaitoll-main-writes
  cancel-in-progress: false

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check citations (+ Wayback for dead links) and apply
        run: |
          python scripts/check_links.py --workers 3 --timeout 25 --wayback \
            --out reports/link_check_latest.csv --apply

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/events.jsonl web reports/link_check_latest.csv
          git diff --staged --quiet && exit 0
          git commit -m "citations: weekly link check $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
